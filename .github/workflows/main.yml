
name: Android CI and Release

on:
  workflow_dispatch:

  push:
    branches:
      - main
    tags:
      - "v*"
    paths-ignore:
      - "README.md"
      - "doc/**"

permissions:
  contents: read

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: "21"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # 修复 Android SDK 安装步骤
      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Configure Signing
        shell: bash
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
          KEY_STORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail

          if [ -z "$SIGNING_KEY" ]; then
            echo "::error::Missing SIGNING_KEY secret"
            exit 1
          fi

          if [ -z "$KEY_STORE_PASSWORD" ] || \
             [ -z "$KEY_ALIAS" ] || \
             [ -z "$KEY_PASSWORD" ]; then
            echo "::error::Android signing secrets are incomplete"
            exit 1
          fi

          printf '%s' "$SIGNING_KEY" |
            base64 --decode > "$GITHUB_WORKSPACE/keystore.jks"

          test -s "$GITHUB_WORKSPACE/keystore.jks"

      - name: Build Release APK
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/keystore.jks
          KEYSTORE_PASS: ${{ secrets.KEY_STORE_PASSWORD }}
          KEY_STORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          ./gradlew :app:android:assembleRelease

      - name: Collect APK
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p release-assets
          APK_DIR="app/android/build/outputs/apk/release"

          if [ ! -d "$APK_DIR" ]; then
            echo "::error::APK output directory not found: $APK_DIR"
            find app/android/build/outputs -type f -name '*.apk' || true
            exit 1
          fi

          find "$APK_DIR" -type f -name '*.apk' \
            -exec cp {} release-assets/ \;

          if ! find release-assets -type f -name '*.apk' \
            -print -quit | grep -q .; then
            echo "::error::No APK was generated"
            exit 1
          fi

          cd release-assets
          sha256sum *.apk > SHA256SUMS.txt

      - name: Upload APK Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AppMarket-Android-Release
          path: release-assets/*
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download APK
        uses: actions/download-artifact@v4
        with:
          name: AppMarket-Android-Release
          path: release-assets

      - name: Update Rolling Release Tag
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git tag -f latest-ci "$GITHUB_SHA"
          git push --force origin refs/tags/latest-ci

      - name: Publish Release
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ github.token }}
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'latest-ci' }}
          target_commitish: ${{ github.sha }}
          name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'Latest CI Build' }}
          body: |
            Automated Android Release build.

            Commit: ${{ github.sha }}

            Includes:
            - Android Release APK
            - SHA256SUMS.txt
          files: |
            release-assets/*.apk
            release-assets/SHA256SUMS.txt
          overwrite_files: true
          fail_on_unmatched_files: true
          prerelease: ${{ !startsWith(github.ref, 'refs/tags/') }}
          make_latest: ${{ startsWith(github.ref, 'refs/tags/') }}

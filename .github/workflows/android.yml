
name: AppMarket Build and Release

on:
  workflow_dispatch:

  push:
    branches:
      - main
    tags:
      - "v*"
    paths-ignore:
      - "README.md"
      - "doc/**"

permissions:
  contents: read

concurrency:
  group: appmarket-build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  android:
    name: Build Android APK
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: "21"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Configure Android SDK
        uses: android-actions/setup-android@v3

      - name: Configure Signing
        shell: bash
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
          KEY_STORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD }}
          SIGNING_ALIAS: ${{ secrets.ALIAS }}
          SIGNING_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail

          if [ -n "$SIGNING_KEY" ]; then
            if [ -z "$KEY_STORE_PASSWORD" ] ||
               [ -z "$SIGNING_ALIAS" ] ||
               [ -z "$SIGNING_PASSWORD" ]; then
              echo "::error::Android signing secrets are incomplete"
              exit 1
            fi

            printf '%s' "$SIGNING_KEY" |
              base64 --decode > "$GITHUB_WORKSPACE/keystore.jks"

            test -s "$GITHUB_WORKSPACE/keystore.jks"

            echo "KEYSTORE_PATH=$GITHUB_WORKSPACE/keystore.jks" >> "$GITHUB_ENV"
          else
            echo "::warning::No release keystore configured; Gradle will use its configured fallback signing."
          fi

      - name: Build Release APK
        env:
          KEY_STORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD }}
          KEYSTORE_PASS: ${{ secrets.KEY_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail

          ./gradlew :app:android:assembleRelease

          mkdir -p release-assets

          APK_FILE="$(find app/android/build/outputs/apk/release \
            -type f -name '*.apk' -print -quit)"

          if [ -z "$APK_FILE" ]; then
            echo "::error::Release APK not found"
            exit 1
          fi

          cp "$APK_FILE" release-assets/

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: AppMarket-Android
          path: release-assets/*.apk
          if-no-files-found: error
          retention-days: 7

  desktop:
    name: Build Desktop (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: Windows
            os: windows-latest
          - platform: macOS
            os: macos-latest
          - platform: Linux
            os: ubuntu-latest

    runs-on: ${{ matrix.os }}
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: "21"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Install Linux packaging tools
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y fakeroot

      - name: Build Desktop Package
        shell: bash
        run: |
          set -euo pipefail

          ./gradlew :app:desktop:packageDistributionForCurrentOS

          OUTPUT_DIR="app/desktop/build/compose/binaries/main"

          if [ ! -d "$OUTPUT_DIR" ]; then
            echo "::error::Desktop output directory not found: $OUTPUT_DIR"
            find app/desktop/build -type f \
              \( -name '*.msi' -o -name '*.dmg' -o -name '*.deb' \) || true
            exit 1
          fi

          mkdir -p release-assets

          mapfile -t PACKAGES < <(
            find "$OUTPUT_DIR" -type f \
              \( -name '*.msi' -o -name '*.dmg' -o -name '*.deb' \)
          )

          if [ "${#PACKAGES[@]}" -eq 0 ]; then
            echo "::error::No desktop installer was generated"
            find app/desktop/build -type f || true
            exit 1
          fi

          for package in "${PACKAGES[@]}"; do
            cp "$package" release-assets/
          done

          ls -lh release-assets/

      - name: Upload Desktop Packages
        uses: actions/upload-artifact@v4
        with:
          name: AppMarket-${{ matrix.platform }}
          path: release-assets/*
          if-no-files-found: error
          retention-days: 7

  release:
    name: Publish GitHub Release
    needs:
      - android
      - desktop

    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Download All Build Artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: AppMarket-*
          path: release-assets
          merge-multiple: true

      - name: Verify Packages and Generate Checksums
        shell: bash
        run: |
          set -euo pipefail

          echo "### Release packages" >> "$GITHUB_STEP_SUMMARY"
          ls -lh release-assets/ | tee -a "$GITHUB_STEP_SUMMARY"

          if ! find release-assets -maxdepth 1 -type f \
            \( -name '*.apk' -o -name '*.msi' \
               -o -name '*.dmg' -o -name '*.deb' \) \
            -print -quit | grep -q .; then
            echo "::error::No release packages found"
            exit 1
          fi

          find release-assets -maxdepth 1 -type f \
            ! -name 'SHA256SUMS.txt' -print0 |
            sort -z |
            xargs -0 sha256sum > release-assets/SHA256SUMS.txt

      - name: Update Rolling Release Tag
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git tag -f latest-ci "$GITHUB_SHA"
          git push --force origin refs/tags/latest-ci

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          token: ${{ github.token }}
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'latest-ci' }}
          name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'Latest CI Build' }}
          body: |
            Automated AppMarket build.

            Commit: ${{ github.sha }}
            Trigger: ${{ github.event_name }}

            Packages:
            - Android APK
            - Windows MSI
            - macOS DMG
            - Linux DEB

            See SHA256SUMS.txt for package checksums.
          files: |
            release-assets/*.apk
            release-assets/*.msi
            release-assets/*.dmg
            release-assets/*.deb
            release-assets/SHA256SUMS.txt
          overwrite_files: true
          fail_on_unmatched_files: true
          prerelease: ${{ !startsWith(github.ref, 'refs/tags/') }}
          make_latest: ${{ startsWith(github.ref, 'refs/tags/') }}
